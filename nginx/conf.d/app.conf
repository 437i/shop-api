# ============================================================
# UPSTREAM
# ============================================================

upstream backend_all {
    server api:8080      weight=2;
    server api-ro-1:8081 weight=1;
    server api-ro-2:8082 weight=1;
}

upstream backend_rw {
    server api:8080;
}

map $request_method $api_upstream {
    default backend_rw;
    GET     backend_all;
}

# ============================================================
# CACHE
# ============================================================
proxy_cache_path /var/cache/nginx/data
    levels=1:2
    keys_zone=site_cache:10m
    max_size=100m
    inactive=60m
    use_temp_path=off;

# ============================================================
# HTTP → HTTPS
# ============================================================
server {
    listen 80;
    server_name local.be3.test;

    location = /status {
        stub_status;
        access_log off;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name local.be3.test;

    # ========================================================
    # TLS
    # ========================================================
    ssl_certificate     /etc/nginx/certs/local.be3.test.crt;
    ssl_certificate_key /etc/nginx/certs/local.be3.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # ========================================================
    # GZIP
    # ========================================================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        font/ttf
        font/otf;

    # ========================================================
    # STATIC
    # ========================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        expires 1h;
    }

    # ========================================================
    # SWAGGER
    # ========================================================
    location = /api/v1 {
        return 301 /api/v1/swagger/index.html;
    }

    location = /api/v1/ {
        return 301 /api/v1/swagger/index.html;
    }

    location = /api/v1/swagger {
        return 301 /api/v1/swagger/index.html;
    }

    location = /api/v1/swagger/ {
        return 301 /api/v1/swagger/index.html;
    }

    location ^~ /api/v1/swagger/ {
        proxy_pass http://backend_all/swagger/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache off;
    }

    # ========================================================
    # API
    # ========================================================
    location = /api {
        return 301 /api/v1;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;

        proxy_pass http://$api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache off;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache off;
    }

    # ========================================================
    # PGADMIN
    # ========================================================
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://pgadmin:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header X-Script-Name /admin;
        proxy_set_header X-Scheme      $scheme;

        proxy_redirect off;

        proxy_cache         site_cache;
        proxy_cache_methods GET;
        proxy_cache_valid   200 10m;
        
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ========================================================
    # STATUS
    # ========================================================
    location = /status {
        stub_status;
        access_log off;
        allow all;
    }
}