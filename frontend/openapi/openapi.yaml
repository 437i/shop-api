          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.LoginRequest"
        description: Credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_auth.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/be2_internal_response.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/be2_internal_response.ErrorResponse"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/be2_internal_response.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/be2_internal_response.ErrorResponse"
      summary: Login user
      tags:
        - auth
  /change:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.ChangeRequest"
        description: Old + New passwords
        required: true
