servers:
  - url: /api/v1
components:
  requestBodies:
    File:
      content:
        application/octet-stream:
          schema:
            type: string
      description: Image bytes
      required: true
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    be2_internal_address.CreateRequest:
      properties:
        city:
          example: Москва
          maxLength: 255
          type: string
        country:
          example: Россия
          maxLength: 255
          type: string
        street:
          example: Ленина, 10
          maxLength: 255
          type: string
      required:
        - city
        - country
        - street
      type: object
    be2_internal_address.Response:
      properties:
        city:
          example: Москва
          type: string
        country:
          example: Россия
          type: string
        id:
          type: string
        street:
          example: Ленина, 10
          type: string
      type: object
    be2_internal_category.CreateRequest:
      properties:
        name:
          example: Холодильники
          maxLength: 255
          type: string
      required:
        - name
      type: object
    be2_internal_category.Response:
      properties:
        id:
