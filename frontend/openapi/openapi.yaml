  /clients:
    get:
      description: Returns all clients or filters them by name and/or surname.
        Supports limit and offset.
      parameters:
        - description: Client name
          in: query
          name: name
          schema:
            type: string
        - description: Client surname
          in: query
          name: surname
          schema:
            type: string
        - description: Maximum items per response
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
        - description: Number of items to skip
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
