      security:
        - BearerAuth: []
      summary: Get a list of clients
      tags:
        - clients
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_client.CreateRequest"
        description: Client data
        required: true
      responses:
