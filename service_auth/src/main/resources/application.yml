grpc:
  server:
    port: 50051

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: tamicacr
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
